---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rbd-pvc
  labels:
    # The consistency-group label value is the group replication ID extracted
    # from the associated VolumeGroupReplicationClass.
    ramendr.openshift.io/consistency-group: rook-ceph-replication-1
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: rook-ceph-block
