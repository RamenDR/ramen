# yamllint disable rule:line-length
---
# Security of checking out a pull request from an issue comment
#
# issue_comment runs this file from the default branch. A pull request
# cannot change it to skip the authorization check.
#
# The test job checks out and runs the commit start verified. This is
# safe because of the following controls:
#
#   Risk              | Mitigation
#   ------------------+--------------------------------------------------
#   Unauthorized runs | start verifies the comment author is listed in
#                     | OWNERS (from the default branch) before the test
#                     | job runs any pull request code.
#   Stale comment     | start publishes the head only when the comment is
#                     | not older than the oldest workflow run for that SHA.
#   GITHUB_TOKEN      | The test job is contents: read. It cannot push,
#                     | comment, or change a status.
#   Git credentials   | The test checkout sets persist-credentials: false,
#                     | so the job token is not stored in .git/config.
#   Repo secrets      | Not used by this workflow. Do NOT add secrets
#                     | without reviewing the security implications.
name: e2e

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

env:
  # Limit number of drenv workers.
  MAX_WORKERS: 4
  BUILD_ID: ${{ github.run_id }}-${{ github.run_attempt }}
  CONTEXT: e2e / test
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}

jobs:
  start:
    # A pull request comment with a line that is exactly "/test e2e".
    # fromJSON supplies a real newline. An expression string has no \n escape.
    if: >-
      github.event.issue.pull_request &&
      contains(
        format('{0}{1}{0}', fromJSON('"\n"'), github.event.comment.body),
        format('{0}/test e2e{0}', fromJSON('"\n"'))
      )
    # A new event waits for this check. Cancelling it would cancel the test.
    # queue: max keeps every pending start. The default queue keeps one and
    # cancels the rest.
    concurrency:
      group: ${{ github.workflow }}-start-${{ github.event.issue.number }}
      cancel-in-progress: false
      queue: max
    permissions:
      actions: read
      contents: read
      pull-requests: write
      statuses: write
    runs-on: ubuntu-24.04
    outputs:
      head_sha: ${{ steps.head.outputs.head_sha }}
    steps:
    # The default branch, for OWNERS. This is not the commit under test.
    - name: Checkout base branch
      uses: actions/checkout@v7

    - name: Install PyYAML
      run: pip install pyyaml

    - name: Check e2e authorization
      id: auth
      env:
        AUTHOR: ${{ github.event.comment.user.login }}
      shell: python3 {0}
      run: |
        import os
        import yaml, sys

        with open("OWNERS") as f:
            users = yaml.safe_load(f)["e2e"]

        author = os.environ["AUTHOR"]

        if author not in users:
            error = f"e2e could not start. @{author} is not in the e2e group in OWNERS."
            recovery = "Add yourself to the OWNERS file to run the e2e workflow."
            with open(os.environ["GITHUB_OUTPUT"], "a") as out:
                out.write(f"error={error}\n")
                out.write(f"recovery={recovery}\n")
            print(f"::warning::{error}")
            sys.exit(1)

    # Publish head_sha only when the comment is not older than the oldest
    # workflow run for that SHA. That run is the push-time proxy.
    - name: Verify pull request head
      id: head
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.issue.number }}
        COMMENT_CREATED_AT: ${{ github.event.comment.created_at }}
      run: |
        fail() {
          echo "error=$1" >> "$GITHUB_OUTPUT"
          echo "recovery=$2" >> "$GITHUB_OUTPUT"
          echo "::warning::$1"
          exit 1
        }

        head_sha="$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq .head.sha)"
        echo "head_sha=$head_sha"
        oldest_run_created_at="$(gh api \
            "repos/$REPO/actions/runs?head_sha=$head_sha&per_page=100" \
            --jq '[.workflow_runs[].created_at] | min // empty')"
        echo "oldest_run_created_at=$oldest_run_created_at"
        if [ -z "$oldest_run_created_at" ]; then
          fail "e2e could not start because no workflow run for the pull request head has been recorded yet." \
              "Please add a new \`/test e2e\` comment when the push has been recorded."
        fi
        if [[ "$COMMENT_CREATED_AT" < "$oldest_run_created_at" ]]; then
          fail "e2e could not start because the PR was updated after the \`/test e2e\` comment was added." \
              "Please add a new \`/test e2e\` comment when the PR is ready for testing."
        fi
        echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"

    - name: Post pending e2e status
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        HEAD_SHA: ${{ steps.head.outputs.head_sha }}
      run: |
        gh api --method POST "repos/$REPO/statuses/$HEAD_SHA" \
            -f state=pending \
            -f context="$CONTEXT" \
            -f description="e2e started" \
            -f target_url="$RUN_URL"

    # Runs when authorization or the head check fails, and after they pass.
    # A failed comment does not fail the job.
    - name: Comment on the pull request
      if: '!cancelled()'
      continue-on-error: true
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.issue.number }}
        ERROR: ${{ steps.auth.outputs.error || steps.head.outputs.error }}
        RECOVERY: ${{ steps.auth.outputs.recovery || steps.head.outputs.recovery }}
        AUTHOR: ${{ github.event.comment.user.login }}
        JOB_STATUS: ${{ job.status }}
        HEAD_SHA: ${{ steps.head.outputs.head_sha }}
        RUN_NUMBER: ${{ github.run_number }}
        RUN_ATTEMPT: ${{ github.run_attempt }}
      run: |
        if [ -n "$ERROR" ]; then
          body="$(printf 'Hey @%s, %s' "$AUTHOR" "$ERROR")"
          if [ -n "$RECOVERY" ]; then
            body="$(printf '%s\n\n%s' "$body" "$RECOVERY")"
          fi
        elif [ "$JOB_STATUS" = success ]; then
          body="$(printf 'Hey @%s, [e2e run %s#%s](%s) started for %s.' \
              "$AUTHOR" "$RUN_NUMBER" "$RUN_ATTEMPT" "$RUN_URL" "${HEAD_SHA:0:12}")"
        else
          exit 0
        fi
        echo "comment: $body"
        gh api --method POST "repos/$REPO/issues/$PR_NUMBER/comments" \
            --raw-field body="$body"

  test:
    needs: start
    # One self-hosted run per pull request. The next test cancels this one.
    concurrency:
      group: ${{ github.workflow }}-test-${{ github.event.issue.number }}
      cancel-in-progress: true
    permissions:
      contents: read
    runs-on: [self-hosted, e2e-rdr]

    steps:
    - name: Checkout PR
      uses: actions/checkout@v7
      with:
        ref: ${{ needs.start.outputs.head_sha }}
        persist-credentials: false

    - name: Build ramen-operator container
      run: make docker-build

    - name: Create virtual environment
      run: |
        hack/make-venv .venv

    - name: Setup drenv
      working-directory: test
      run: |
        echo test/drenv.log >> "$GITHUB_WORKSPACE/artifacts.txt"
        source ../venv
        drenv setup envs/regional-dr.yaml

    - name: Delete clusters
      if: always()
      working-directory: test
      run: |
        source ../venv
        drenv delete envs/regional-dr.yaml

    - name: Setup libvirt
      run: test/scripts/setup-libvirt

    - name: Start clusters
      uses: nick-fields/retry@v4
      with:
        timeout_minutes: 20
        max_attempts: 3
        command: |
          cd test
          source ../venv
          drenv start --max-workers ${{ env.MAX_WORKERS }} envs/regional-dr.yaml

    - name: Deploy ramen
      run: |
        source venv
        ramendev deploy test/envs/regional-dr.yaml

    - name: Configure ramen
      uses: nick-fields/retry@v4
      with:
        timeout_seconds: 120
        max_attempts: 3
        command: |
          source venv
          ramendev config test/envs/regional-dr.yaml

    - name: Prepare e2e config
      working-directory: e2e
      run: cat config.yaml.sample ~/.config/drenv/rdr/config.yaml > config.yaml

    - name: Run e2e validation
      working-directory: e2e
      run: |
        echo e2e/validation.log >> "$GITHUB_WORKSPACE/artifacts.txt"
        ./run.sh -test.run TestValidation -logfile validation.log

    - name: Run e2e dr tests
      working-directory: e2e
      run: |
        echo e2e/dr.log >> "$GITHUB_WORKSPACE/artifacts.txt"
        ./run.sh -test.run TestDR -logfile dr.log

    - name: Gather environment data
      if: always()
      working-directory: test
      # Gathering typically takes less than 15 seconds.
      timeout-minutes: 3
      run: |
        echo test/gather.rdr >> "$GITHUB_WORKSPACE/artifacts.txt"
        source ../venv
        drenv gather --directory gather.rdr envs/regional-dr.yaml

    # Tar manually to work around github limitations with special characters (:)
    # in file names, and getting much smaller archives compared with zip (6m vs
    # 12m). This is also useful to collect all files in one archive.
    # Upload as a single unzipped file (archive: false) so the download is the
    # .tar.gz itself — no outer zip wrapper.
    # https://github.com/actions/upload-artifact/issues/546
    - name: Archive artifacts
      if: always()
      run: |
        tar --create \
            --use-compress-program='gzip -9' \
            --file e2e.${{ env.BUILD_ID }}.tar.gz \
            --transform "s|^|e2e.${{ env.BUILD_ID }}/|" \
            --files-from artifacts.txt

    - name: Upload artifacts
      if: always()
      uses: actions/upload-artifact@v7
      with:
        path: e2e.${{ env.BUILD_ID }}.tar.gz
        archive: false
        retention-days: 15

    - name: Delete clusters
      if: always()
      working-directory: test
      run: |
        source ../venv
        drenv delete envs/regional-dr.yaml

    - name: Cleanup drenv
      if: always()
      working-directory: test
      run: |
        source ../venv
        drenv cleanup envs/regional-dr.yaml

  finish:
    # Wait until start and test complete (success or failure).
    needs: [start, test]
    # Skip if start failed.
    if: always() && needs.start.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      pull-requests: write
      statuses: write
    steps:
    - name: Compute test duration
      id: test
      if: needs.test.result == 'success' || needs.test.result == 'failure'
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        RUN_ID: ${{ github.run_id }}
      run: |
        test_job="$(gh api \
            "repos/$REPO/actions/runs/$RUN_ID/jobs" \
            --jq '.jobs[] | select(.name == "test")')"
        started_at="$(echo "$test_job" | jq --raw-output .started_at)"
        completed_at="$(echo "$test_job" | jq --raw-output .completed_at)"
        started_s="$(date -d "$started_at" +%s)"
        completed_s="$(date -d "$completed_at" +%s)"
        secs="$((completed_s - started_s))"
        if [ "$secs" -ge 3600 ]; then
          duration="$((secs / 3600))h$((secs % 3600 / 60))m$((secs % 60))s"
        elif [ "$secs" -ge 60 ]; then
          duration="$((secs / 60))m$((secs % 60))s"
        else
          duration="${secs}s"
        fi
        echo "duration=$duration"
        echo "duration=$duration" >> "$GITHUB_OUTPUT"

    - name: Post e2e status
      # A canceled test leaves the pending status, so the newer run can replace it.
      # Duration is optional. always() posts the result when that step failed.
      if: always() && (needs.test.result == 'success' || needs.test.result == 'failure')
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        HEAD_SHA: ${{ needs.start.outputs.head_sha }}
        TEST_RESULT: ${{ needs.test.result }}
        DURATION: ${{ steps.test.outputs.duration }}
      run: |
        if [ "$TEST_RESULT" = success ]; then
          state=success
          description=successful
        else
          state=failure
          description=failed
        fi
        if [ -n "$DURATION" ]; then
          description="$description in $DURATION"
        fi
        echo "e2e status: $state ($description)"
        gh api --method POST "repos/$REPO/statuses/$HEAD_SHA" \
            -f state="$state" \
            -f context="$CONTEXT" \
            -f description="$description" \
            -f target_url="$RUN_URL"

    # A canceled test gets a comment and does not change the status.
    # always() posts the result when an earlier finish step failed.
    # A failed comment does not fail the job.
    - name: Comment on the pull request
      if: always()
      continue-on-error: true
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.issue.number }}
        TEST_RESULT: ${{ needs.test.result }}
        AUTHOR: ${{ github.event.comment.user.login }}
        HEAD_SHA: ${{ needs.start.outputs.head_sha }}
        RUN_NUMBER: ${{ github.run_number }}
        RUN_ATTEMPT: ${{ github.run_attempt }}
      run: |
        case "$TEST_RESULT" in
          success) verb=passed ;;
          failure) verb=failed ;;
          cancelled) verb=canceled ;;
          *) exit 0 ;;
        esac
        body="$(printf 'Hey @%s, [e2e run %s#%s](%s) %s for %s.' \
            "$AUTHOR" "$RUN_NUMBER" "$RUN_ATTEMPT" "$RUN_URL" "$verb" "${HEAD_SHA:0:12}")"
        echo "comment: $body"
        gh api --method POST "repos/$REPO/issues/$PR_NUMBER/comments" \
            --raw-field body="$body"
