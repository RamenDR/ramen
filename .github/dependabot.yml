---
version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    # These Kubernetes/operator libraries are upgraded deliberately and in
    # lockstep; leave them out of automated Dependabot bumps.
    ignore:
      - dependency-name: "k8s.io/api"
      - dependency-name: "k8s.io/apimachinery"
      - dependency-name: "k8s.io/component-base"
      - dependency-name: "sigs.k8s.io/controller-runtime"
      - dependency-name: "github.com/operator-framework/api"

  - package-ecosystem: "gomod"
    directory: "/api"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "k8s.io/api"
      - dependency-name: "k8s.io/apimachinery"
      - dependency-name: "k8s.io/component-base"
      - dependency-name: "sigs.k8s.io/controller-runtime"
      - dependency-name: "github.com/operator-framework/api"

  - package-ecosystem: "gomod"
    directory: "/e2e"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "k8s.io/api"
      - dependency-name: "k8s.io/apimachinery"
      - dependency-name: "k8s.io/component-base"
      - dependency-name: "sigs.k8s.io/controller-runtime"
      - dependency-name: "github.com/operator-framework/api"

  - package-ecosystem: "gomod"
    directory: "/test/timestamp"
    schedule:
      interval: "weekly"

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "pip"
    directory: "/test"
    schedule:
      interval: "weekly"

  - package-ecosystem: "pip"
    directory: "/ramendev"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
